name: Daily CDC Report

on:
  schedule:
    # 7:00 ICT (UTC+7) = 00:00 UTC ทุกวัน
    - cron: '0 0 * * *'
  workflow_dispatch:    # อนุญาตให้กด Run ด้วยมือเพื่อทดสอบ

# สิทธิ์ที่ workflow ใช้
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกันการรันซ้อน
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # ระบุ Time Zone ใน environment variables
    env:
      TZ: Asia/Bangkok

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        run: python report.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
